name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore
        run: dotnet restore OCoD.slnx
      - name: Build
        run: dotnet build OCoD.slnx -c Release --no-restore
      - name: Test
        run: dotnet test OCoD.slnx -c Release --no-build
      - name: Verify clean-room samples
        run: node tools/cleanroom/samples.mjs verify

  aot:
    name: NativeAOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            blocking: true
          - rid: osx-x64
            os: macos-15
            blocking: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ensure vswhere on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          if (Test-Path $installer) {
            $installer | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Publish AOT components
        shell: bash
        run: |
          for p in OCoD.Launcher OCoD.GlobalDaemon OCoD.LibraryDaemon OCoD.CharacterHost; do
            dotnet publish "src/$p/$p.csproj" -c Release -r "${{ matrix.rid }}" -o "artifacts/${{ matrix.rid }}" --nologo
          done
